server {
    server_name humble.band www.humble.band;
    root /var/www/humble.band;
    index index.html;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static images directly
    location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/humble.band/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/humble.band/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


} server {
    if ($host = www.humble.band) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = humble.band) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name humble.band www.humble.band;
    return 404; # managed by Certbot




}